name: Hikki Fit Android Experimental
on:
  push:
    branches: [hikki-fit-capacitor-test]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'native.js'
      - 'scripts/build-android.cjs'
      - 'tests/**'
      - '.github/workflows/android-experimental.yml'
      - '*.js'
      - '*.html'
      - '*.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "SDK 35 ja instalado"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --version
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hikki-fit-experimental-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
