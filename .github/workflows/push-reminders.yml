name: Hikki Fit — lembretes push
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Enviar push de teste agora (ignora horario)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save firebase-admin@13.6.0 luxon@3.7.2
      - run: node scripts/send-push.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_TEST: ${{ inputs.test_push }}
